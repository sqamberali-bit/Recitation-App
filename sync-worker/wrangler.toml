name = "recitation-sync"
main = "src/worker.ts"
compatibility_date = "2024-09-23"

[vars]
ALLOWED_ORIGIN = "https://sqamberali-bit.github.io"

[[d1_databases]]
binding = "DB"
database_name = "recitation-sync"
database_id = "placeholder-create-with-wrangler"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "recitation-media"

# SYNC_TOKEN must be set as a secret:
#   npx wrangler secret put SYNC_TOKEN
